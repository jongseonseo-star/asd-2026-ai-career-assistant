<section class="feature-card feature-card--error">
    <div class="card-heading">
        <div>
            <p class="eyebrow">Service unavailable</p>
            <h3>{{ section_title }}</h3>
        </div>
    </div>
    <div class="notice notice--error" role="alert">{{ message }}</div>
    <button
        type="button"
        class="button button--secondary"
        hx-get="{{ retry_url }}"
        hx-target="{{ retry_target }}"
        hx-swap="innerHTML">
        Retry
    </button>
</section>
