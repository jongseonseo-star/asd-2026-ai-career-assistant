<article class="record-card record-card--editing" id="profile-card-{{ profile.id }}">
    <div class="record-card__topline">
        <span class="record-id">Editing Profile #{{ profile.id }}</span>
        <span class="role-badge">Update</span>
    </div>
    <form
        class="form-grid form-grid--compact"
        hx-put="/ui/profiles/{{ profile.id }}"
        hx-target="#profiles-section"
        hx-swap="innerHTML"
        hx-disabled-elt="find button">
        <label>
            <span>Full name</span>
            <input name="full_name" value="{{ profile.full_name }}" maxlength="120" required>
        </label>
        <label>
            <span>Email</span>
            <input name="email" type="email" value="{{ profile.email }}" maxlength="254" required>
        </label>
        <label class="form-span-2">
            <span>Target role</span>
            <input name="target_role" value="{{ profile.target_role }}" maxlength="120" required>
        </label>
        <label class="form-span-2">
            <span>Career summary</span>
            <textarea name="career_summary" rows="4" maxlength="3000" required>{{ profile.career_summary }}</textarea>
        </label>
        <div class="form-actions form-span-2">
            <button class="button button--primary button--small" type="submit">Save Changes</button>
            <button
                class="button button--ghost button--small"
                type="button"
                hx-get="/ui/profiles"
                hx-target="#profiles-section"
                hx-swap="innerHTML">
                Cancel
            </button>
            <span class="htmx-indicator mini-loader">Updating…</span>
        </div>
    </form>
</article>
