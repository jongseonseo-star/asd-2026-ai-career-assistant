name: student-2-resume-profile

services:
  student-2-database:
    build:
      context: ./database
    image: student-2-database:release0
    environment:
      PORT: "5002"
      DB_PATH: /app/data/candidate_data.db
    ports:
      - "5002:5002"
    volumes:
      - student-2-database-data:/app/data
    networks:
      - student-2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  student-2-backend:
    build:
      context: ./backend
    image: student-2-backend:release0
    environment:
      PORT: "5001"
      DATABASE_API_URL: http://student-2-database:5002
      DATABASE_TIMEOUT_SECONDS: "5"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b
      OLLAMA_TIMEOUT_SECONDS: "180"
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      student-2-database:
        condition: service_healthy
    networks:
      - student-2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  student-2-frontend:
    build:
      context: ./frontend
    image: student-2-frontend:release0
    environment:
      PORT: "8082"
      BACKEND_API_URL: http://student-2-backend:5001
      BACKEND_TIMEOUT_SECONDS: "10"
      AI_TIMEOUT_SECONDS: "180"
    ports:
      - "8082:8082"
    depends_on:
      student-2-backend:
        condition: service_healthy
    networks:
      - student-2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

networks:
  student-2-network:
    driver: bridge

volumes:
  student-2-database-data:
